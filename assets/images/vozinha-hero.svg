<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="aura" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A4D80" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0C2645" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#03070D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#F2D36E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F2D36E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E335C"/>
      <stop offset="50%" stop-color="#07192E"/>
      <stop offset="100%" stop-color="#020914"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2D36E"/>
      <stop offset="100%" stop-color="#C79D3A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Stadium Atmosphere Glow -->
  <rect width="800" height="1000" fill="url(#aura)"/>
  <circle cx="400" cy="420" r="320" fill="url(#goldGlow)"/>

  <!-- Halo Ring of Cabo Verde Stars -->
  <g opacity="0.6" stroke="#F2D36E" stroke-width="1.5" fill="none" stroke-dasharray="4 8">
    <circle cx="400" cy="420" r="280"/>
    <circle cx="400" cy="420" r="310" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Goalkeeper Silhouette / Cutout Silhouette -->
  <!-- Torso & Shoulders -->
  <path d="M 280 440 L 400 370 L 520 440 L 580 580 L 530 880 L 270 880 L 220 580 Z" fill="url(#bodyGrad)" stroke="#1A518A" stroke-width="2"/>
  
  <!-- Jersey Collar & Accents -->
  <path d="M 350 400 L 400 450 L 450 400 Z" fill="#003882" stroke="#F2D36E" stroke-width="2"/>
  <path d="M 330 460 Q 400 500 470 460" stroke="#F2D36E" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Jersey Number 1 (Gold) -->
  <text x="400" y="650" font-family="'Impact', 'Bebas Neue', sans-serif" font-size="160" font-weight="900" fill="url(#goldAcc)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">1</text>
  <text x="400" y="700" font-family="'Courier New', monospace" font-size="20" fill="#E9F0EC" text-anchor="middle" letter-spacing="10" opacity="0.85">VOZINHA</text>
  <text x="400" y="730" font-family="'Courier New', monospace" font-size="13" fill="#8C9BA5" text-anchor="middle" letter-spacing="6">CABO VERDE • TUBARÕES AZUIS</text>

  <!-- Head & Focus Profile -->
  <ellipse cx="400" cy="270" rx="75" ry="95" fill="#07192E" stroke="#1A518A" stroke-width="2"/>
  <!-- Focus Gaze Highlights -->
  <path d="M 365 260 Q 380 255 395 260" stroke="#F2D36E" stroke-width="3" fill="none"/>
  <path d="M 405 260 Q 420 255 435 260" stroke="#F2D36E" stroke-width="3" fill="none"/>
  <circle cx="380" cy="265" r="4" fill="#F2D36E" filter="url(#glow)"/>
  <circle cx="420" cy="265" r="4" fill="#F2D36E" filter="url(#glow)"/>

  <!-- Goalkeeper Gloves (Raised in Stance) -->
  <!-- Left Glove -->
  <g transform="translate(140, 480) rotate(-15)">
    <rect x="0" y="0" width="100" height="150" rx="25" fill="#0E335C" stroke="#F2D36E" stroke-width="3"/>
    <rect x="15" y="20" width="70" height="90" rx="10" fill="#F2D36E" opacity="0.85"/>
    <text x="50" y="75" font-family="sans-serif" font-size="24" font-weight="900" fill="#03070D" text-anchor="middle">#1</text>
  </g>
  <!-- Right Glove -->
  <g transform="translate(560, 450) rotate(15)">
    <rect x="0" y="0" width="100" height="150" rx="25" fill="#0E335C" stroke="#F2D36E" stroke-width="3"/>
    <rect x="15" y="20" width="70" height="90" rx="10" fill="#F2D36E" opacity="0.85"/>
    <text x="50" y="75" font-family="sans-serif" font-size="24" font-weight="900" fill="#03070D" text-anchor="middle">#1</text>
  </g>

  <!-- Stadium Lighting Dust / Sparks -->
  <circle cx="280" cy="310" r="3" fill="#F2D36E" opacity="0.6"/>
  <circle cx="520" cy="290" r="2.5" fill="#F2D36E" opacity="0.8"/>
  <circle cx="210" cy="540" r="3.5" fill="#35C39F" opacity="0.7"/>
  <circle cx="610" cy="620" r="2" fill="#35C39F" opacity="0.5"/>
</svg>